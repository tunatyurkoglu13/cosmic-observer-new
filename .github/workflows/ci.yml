name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run test suite (excludes real external-API calls — see network-tests job)
        run: pytest tests/ -q -m "not network and not slow"

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cosmic-observer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — container actually boots and serves /healthz
        run: |
          docker run -d --name smoke -p 8000:8000 cosmic-observer:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/healthz; then echo "OK"; break; fi
            if [ "$i" -eq 20 ]; then echo "Container never became healthy"; docker logs smoke; exit 1; fi
            sleep 2
          done
          docker stop smoke

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (main only — PRs only build+smoke-test, never publish)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  network-tests:
    # Hits real external APIs (NASA, CelesTrak, JPL) — runs on a schedule
    # instead of every push/PR so a flaky/rate-limited third party (this
    # project has genuinely hit NASA's DEMO_KEY rate limit before) never
    # blocks a PR. Failures here are informational, not a merge gate.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run network-marked tests against real external APIs
        run: pytest tests/ -q -m network
        continue-on-error: true
